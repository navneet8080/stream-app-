# =============================================================================
# 24×7 Broadcast Control System - Production Docker Compose
# =============================================================================
#
# Start with: docker compose up -d
# Stop with: docker compose down
#
# SETUP:
#   1. Place video files in 'output/' folder (or upload via dashboard)
#   2. Open dashboard at http://localhost:8000
#   3. Add streaming destinations via UI
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx-RTMP Relay Server (HLS Preview + Stats)
  # ---------------------------------------------------------------------------
  nginx-rtmp:
    build: ./nginx
    container_name: simulcast_nginx
    ports:
      - "1935:1935" # RTMP ingest
      - "80:80" # HLS + /stat
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 5
    networks:
      - simulcast

  # ---------------------------------------------------------------------------
  # Stream Engine (24×7 FFmpeg – Database-Driven)
  # ---------------------------------------------------------------------------
  stream-engine:
    build: ./app
    container_name: simulcast_engine
    restart: always
    volumes:
      - ./output:/app/output # Video files (read-write for uploads)
      - ./data:/app/data # SQLite database persistence
      - ./config:/app/config:ro # Runtime config (read-only)
    environment:
      - STREAM_MODE=loop
      - RESOLUTION=1080p
      - RTMP_SERVER_URL=rtmp://nginx-rtmp:1935/live/stream
      - VIDEO_FOLDER=/app/output
      - DB_PATH=/app/data/broadcast.db
    env_file:
      - .env
    depends_on:
      nginx-rtmp:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "pgrep", "-f", "ffmpeg" ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - simulcast
    command: [ "python", "-u", "entrypoint.py" ]

  # ---------------------------------------------------------------------------
  # Web Dashboard (Broadcast Control Panel)
  # ---------------------------------------------------------------------------
  web-dashboard:
    build: ./app
    container_name: simulcast_dashboard
    restart: always
    ports:
      - "8080:8000" # Dashboard UI (internal 8000 → host 8080)
    volumes:
      - ./output:/app/output # For video uploads
      - ./data:/app/data # Read/write playlist DB
      - ./config:/app/config:ro
    environment:
      - NGINX_STAT_URL=http://nginx-rtmp/stat
      - FLASK_ENV=production
      - VIDEO_FOLDER=/app/output
      - DB_PATH=/app/data/broadcast.db
    env_file:
      - .env
    depends_on:
      - nginx-rtmp
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - simulcast
    command: [ "gunicorn", "-k", "gevent", "-w", "4", "-b", "0.0.0.0:8000", "--timeout", "600", "main:app" ]

networks:
  simulcast:
    driver: bridge
