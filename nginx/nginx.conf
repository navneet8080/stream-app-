worker_processes auto;
rtmp_auto_push on;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;
        
        # Buffer settings for stable streaming
        buflen 1s;

        application live {
            live on;
            record off;
            
            # Allow publishing from internal network only
            # In production, add IP restrictions
            
            # HLS Configuration
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3;
            hls_playlist_length 60;
            hls_cleanup on;
            
            # Keyframe settings for smooth playback
            wait_key on;
            wait_video on;
            
            # Drop idle streams after 30s
            drop_idle_publisher 30s;
            
            # NOTE: Multi-destination push is now handled by FFmpeg directly.
            # Nginx only serves HLS preview and /stat monitoring.
        }
    }
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name localhost;

        # RTMP Statistics (MANDATORY for monitoring)
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            
            # Allow access from internal containers
            # In production, restrict by IP
        }

        location /stat.xsl {
            root /etc/nginx/;
        }

        # HLS Streaming
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            
            root /tmp;
            add_header Cache-Control no-cache;
            
            # CORS headers for cross-origin requests
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
